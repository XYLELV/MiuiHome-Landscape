name: Android Alpha CI

on:
  push:
    branches:
      - main
      - "alpha/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source archive rules
        shell: pwsh
        run: ./tools/verify_source.ps1

      - name: Build and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --no-daemon --console=plain

      - name: Upload Alpha debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiuiHomeLandscape-v5.3.1-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
